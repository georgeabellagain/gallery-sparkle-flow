<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 784" width="1200" height="784" role="img" aria-labelledby="t d"><title id="t">An open portfolio under changing studio lighting</title><desc id="d">An open printed portfolio on cream. A beam of light sweeps across it, the highlight and shadow move, the paper gains texture, and the lighting and paper selectors change.</desc><style>text{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif',Georgia,'Times New Roman',serif}.a{animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.6,0,.2,1);animation-fill-mode:both}@media (prefers-reduced-motion:reduce){.a{animation-play-state:paused!important;animation-delay:var(--poster)!important}}svg{--poster:-8s}@keyframes sweep{0%,20%{transform:rotate(14deg)}25%,45%{transform:rotate(22deg)}50%,70%{transform:rotate(31deg)}75%,95%{transform:rotate(40deg)}100%{transform:rotate(14deg)}}@keyframes band{0%,20%{transform:translateX(0)}25%,45%{transform:translateX(120px)}50%,70%{transform:translateX(250px)}75%,95%{transform:translateX(380px)}100%{transform:translateX(0)}}@keyframes shad{0%,20%{transform:translateX(44px)}25%,45%{transform:translateX(28px)}50%,70%{transform:translateX(10px)}75%,95%{transform:translateX(-8px)}100%{transform:translateX(44px)}}@keyframes warm{0%,20%{opacity:0}25%,45%{opacity:.1}50%,70%{opacity:.16}75%,95%{opacity:.05}100%{opacity:0}}@keyframes grain{0%,45%{opacity:0}50%,95%{opacity:.5}100%{opacity:0}}@keyframes lring{0%,20%{transform:translateX(0)}25%,45%{transform:translateX(40px)}50%,70%{transform:translateX(80px)}75%,95%{transform:translateX(120px)}100%{transform:translateX(0)}}@keyframes pring{0%,45%{transform:translateX(0)}50%,95%{transform:translateX(80px)}100%{transform:translateX(0)}}</style><defs>
